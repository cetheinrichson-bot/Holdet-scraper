name: Scrape Holdet Statistics
on:
  schedule:
    - cron: "49 * * * *"
  workflow_dispatch:
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install deps
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      # ── Din originale scraper – uændret ──
      - name: Run scraper
        run: npm run scrape

      - name: Upload data folder as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-folder
          path: data
          if-no-files-found: warn
          retention-days: 7

      - name: Commit data folder (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update data artifacts [skip ci]"
            git push
          fi

      # ── Nyt trin: sync vækstdata til Firebase ──
      # Kører KUN hvis data/latest.json eksisterer og har ændret sig.
      # Rører ikke ved din Google Sheets-integration.
      - name: Install firebase-admin
        run: npm install firebase-admin

      - name: Sync growth data to Firebase
        if: always()
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node firebase-sync.cjs
