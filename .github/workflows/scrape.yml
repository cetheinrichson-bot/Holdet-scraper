name: Scrape Holdet Statistics
on:
  schedule:
    # r1: 24/07 18:00 → 30/07 00:00
    - cron: '0 * 24,25,26,27,28,29,30 7 *'
    # r2: 01/08 17:00 → 06/08 00:00
    - cron: '0 * 1,2,3,4,5,6 8 *'
    # r3: 07/08 18:00 → 13/08 00:00
    - cron: '0 * 7,8,9,10,11,12,13 8 *'
    # r4: 14/08 18:00 → 20/08 00:00
    - cron: '0 * 14,15,16,17,18,19,20 8 *'
    # r5: 21/08 18:00 → 27/08 00:00
    - cron: '0 * 21,22,23,24,25,26,27 8 *'
    # r6: 28/08 18:00 → 03/09 00:00
    - cron: '0 * 28,29,30,31 8 *'
    - cron: '0 * 1,2,3 9 *'
    # r7: 02/09 18:00 → 10/09 00:00
    - cron: '0 * 2,3,4,5,6,7,8,9,10 9 *'
    # r8: 12/09 18:00 → 16/09 00:00
    - cron: '0 * 12,13,14,15,16 9 *'
    # r9: 19/09 18:00 → 23/09 00:00
    - cron: '0 * 19,20,21,22,23 9 *'
    # r10: 10/10 18:00 → 14/10 00:00
    - cron: '0 * 10,11,12,13,14 10 *'
    # r11: 17/10 18:00 → 21/10 00:00
    - cron: '0 * 17,18,19,20,21 10 *'
    # r12: 24/10 18:00 → 28/10 00:00
    - cron: '0 * 24,25,26,27,28 10 *'
    # r13: 31/10 18:00 → 04/11 00:00
    - cron: '0 * 31 10 *'
    - cron: '0 * 1,2,3,4 11 *'
    # r14: 07/11 18:00 → 11/11 00:00
    - cron: '0 * 7,8,9,10,11 11 *'
    # r15: 21/11 18:00 → 25/11 00:00
    - cron: '0 * 21,22,23,24,25 11 *'
    # r16: 28/11 18:00 → 02/12 00:00
    - cron: '0 * 28,29,30 11 *'
    - cron: '0 * 1,2 12 *'
    # r17: 05/12 18:00 → 09/12 00:00
    - cron: '0 * 5,6,7,8,9 12 *'
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install deps
        run: |
          npm install firebase-admin
          npm install
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run scraper
        run: npm run scrape
      - name: Upload data folder as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: data-folder
          path: data
          if-no-files-found: warn
          retention-days: 7
      - name: Commit data folder (if changed)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update data artifacts [skip ci]"
            git push
          fi
      - name: Sync growth data to Firebase
        if: always()
        env:
          FIREBASE_DATABASE_URL: ${{ secrets.FIREBASE_DATABASE_URL }}
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: node firebase-sync.cjs
